# Camera-delay experiment -- base run parameters.
#
# Consumed by experiments/camera_delay/run_eval.py (driver mode). Every key maps
# to a field of RunConfig in experiments/camera_delay/config.py. Command-line
# flags (--task, --ckpt, --delays, ...) override these values.
#
# Mirrors the arguments of `bash scripts/robodojo.sh eval`.

dataset: RoboDojo
# Absolute or repo-relative path to an XPolicyLab policy directory. It must
# contain eval.sh + setup_eval_policy_server.sh + setup_eval_env_client.sh.
policy_dir: XPolicyLab/policy/ACT

# REQUIRED: set task and ckpt for your run (or pass --task / --ckpt).
task: stack_blocks
ckpt: ""

env_cfg: arx_x5
# "joint" or "ee"; must match what the policy checkpoint was trained with.
action_type: joint
seed: 0
# Number of episodes per delay value ("native" is not supported here; use a number).
eval_num: "1"

# Conda envs used by the policy server and the sim client.
policy_env: RoboDojo
eval_env: RoboDojo

policy_gpu: "0"
env_gpu: "0"

# Runner plumbing.
robodojo_sh: scripts/robodojo.sh
results_dir: experiments/camera_delay/results
